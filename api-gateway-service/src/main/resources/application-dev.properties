spring.application.name=api-gateway-service
server.port=8081

# Eureka Discovery Configuration
eureka.client.service-url.defaultZone: http://localhost:8082/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Redis Connection for Distributed Rate Limiting
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:default}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:root@123}
spring.cloud.gateway.filter.request-rate-limiter.deny-empty-key=false

# ----------------------------------------------------
# Route 0: PRODUCT-SERVICE
# ----------------------------------------------------
spring.cloud.gateway.routes[0].id=PRODUCT-SERVICE
spring.cloud.gateway.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/product-service/v1/**
spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}

# ----------------------------------------------------
# Route 1: USER-SERVICE
# ----------------------------------------------------
spring.cloud.gateway.routes[1].id=USER-SERVICE
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/user-service/v1/**
spring.cloud.gateway.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.routes[1].filters[0].args.key-resolver=#{@ipKeyResolver}

# ----------------------------------------------------
# Route 2: ORDER-SERVICE
# ----------------------------------------------------
spring.cloud.gateway.routes[2].id=ORDER-SERVICE
spring.cloud.gateway.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/order-service/v1/**
spring.cloud.gateway.routes[2].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[2].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[2].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[2].filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.routes[2].filters[0].args.key-resolver=#{@ipKeyResolver}

# ----------------------------------------------------
# Route 3: AUTH-SERVICE (Stricter limit: 5 req/s, burst 10 tokens)
# ----------------------------------------------------
spring.cloud.gateway.routes[3].id=AUTH-SERVICE
spring.cloud.gateway.routes[3].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth-service/v1/**
spring.cloud.gateway.routes[3].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[3].filters[0].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.routes[3].filters[0].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.routes[3].filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.routes[3].filters[0].args.key-resolver=#{@ipKeyResolver}

# ----------------------------------------------------
# Route 4: CART-SERVICE
# ----------------------------------------------------
spring.cloud.gateway.routes[4].id=CART-SERVICE
spring.cloud.gateway.routes[4].uri=lb://CART-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/cart-service/v1/**
spring.cloud.gateway.routes[4].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[4].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[4].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[4].filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.routes[4].filters[0].args.key-resolver=#{@ipKeyResolver}

# ----------------------------------------------------
# Route 5: ANALYTICS-SERVICE
# ----------------------------------------------------
spring.cloud.gateway.routes[5].id=ANALYTICS-SERVICE
spring.cloud.gateway.routes[5].uri=lb://ANALYTICS-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/analytics-service/v1/**


# Actuator & Logging
management.endpoints.web.exposure.include=*
logging.level.org.springframework.cloud.gateway=DEBUG

# Kafka Configuration for Usage Tracking
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.usage-tracking.topic=${APP_USAGE_TOPIC:app-usage-events}
app.usage-tracking.enabled=true

