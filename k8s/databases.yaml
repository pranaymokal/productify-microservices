# ====================================================
# DATABASE CONFIGMAP & SECRETS
# ====================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  labels:
    app.kubernetes.io/part-of: microservices-platform
data:
  USER_DATABASE: "user"
  PRODUCT_DATABASE: "product"
  ORDER_DATABASE: "order"
  ANALYTICS_DATABASE: "analytics"
  MONGO_INITDB_ROOT_USERNAME: "root"
  REDIS_USERNAME: "default"
---
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  labels:
    app.kubernetes.io/part-of: microservices-platform
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root@123"
  MONGO_INITDB_ROOT_PASSWORD: "root123"
  REDIS_PASSWORD: "root@123"
---
# ====================================================
# USER MYSQL (StatefulSet & Service)
# ====================================================
apiVersion: v1
kind: Service
metadata:
  name: user-mysql
  labels:
    app: user-mysql
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: user-mysql
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-mysql
spec:
  serviceName: user-mysql
  replicas: 1
  selector:
    matchLabels:
      app: user-mysql
  template:
    metadata:
      labels:
        app: user-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: database-config
              key: USER_DATABASE
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: user-mysql-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: user-mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi
---
