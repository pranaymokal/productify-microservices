# ====================================================
# MICROSERVICES CONFIGMAP & SECRETS
# ====================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  labels:
    app.kubernetes.io/part-of: microservices-platform
data:
  JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms128m -Xmx384m -Djava.security.egd=file:/dev/./urandom -Dmanagement.endpoints.web.exposure.include=health,info,metrics,prometheus -Dmanagement.endpoint.prometheus.enabled=true"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-service:8082/eureka/"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  SPRING_DATASOURCE_USERNAME: "root"
  USER_DATASOURCE_URL: "jdbc:mysql://user-mysql:3306/user"
  PRODUCT_DATASOURCE_URL: "jdbc:mysql://product-mysql:3306/product"
  ORDER_DATASOURCE_URL: "jdbc:mysql://order-mysql:3306/order"
  ANALYTICS_DATASOURCE_URL: "jdbc:mysql://analytics-mysql:3306/analytics"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_USERNAME: "default"
---
apiVersion: v1
kind: Secret
metadata:
  name: microservices-secret
  labels:
    app.kubernetes.io/part-of: microservices-platform
type: Opaque
stringData:
  JWT_SECRET_KEY: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
  SPRING_DATASOURCE_PASSWORD: "root@123"
  SPRING_DATA_REDIS_PASSWORD: "root@123"
  CART_MONGODB_URI: "mongodb://root:root123@cart-mongo:27017/cart-service?authSource=admin"
---
# ====================================================
# DISCOVERY SERVICE (EUREKA)
# ====================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  labels:
    app: discovery-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
      - name: discovery-service
        image: discovery-service:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: JAVA_TOOL_OPTIONS
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: JAVA_TOOL_OPTIONS
        ports:
        - containerPort: 8082
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          periodSeconds: 15
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  labels:
    app: discovery-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: discovery-service
---
