version: '3.8'

services:
  discovery-service:
    build: ./discovery-service
    image: discovery-service:latest
    container_name: discovery-service
    ports:
      - "8082:8082"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass root@123
    ports:
      - "6379:6379"
    networks:
      - backend

  api-gateway-service:
    build: ./api-gateway-service
    image: api-gateway-service:latest
    container_name: api-gateway-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8082/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_USERNAME=default
      - SPRING_DATA_REDIS_PASSWORD=root@123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      - discovery-service
      - redis
      - kafka
    networks:
      - backend

  auth-service:
    build: ./auth-service
    image: auth-service:latest
    container_name: auth-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8082/eureka/
    ports:
      - "8083:8083"
    depends_on:
      - discovery-service
    networks:
      - backend

  cart-service:
    build: ./cart-service
    image: cart-service:latest
    container_name: cart-service
    ports:
      - "8084:8084"
    depends_on:
      - cart-mongo
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://root:root123@cart-mongo:27017/cart-service?authSource=admin
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8082/eureka/
    networks:
      - backend

  cart-mongo:
    image: mongo:6.0
    container_name: cart-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root123
    volumes:
      - cart-mongo-data:/data/db
    networks:
      - backend

  user-service:
    build: ./user-service
    image: user-service:latest
    container_name: user-service
    ports:
      - "8085:8085"
    depends_on:
      - user-mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://user-mysql:3306/user
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root@123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8082/eureka/
    networks:
      - backend

  user-mysql:
    image: mysql:8.0
    container_name: user-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root@123
      - MYSQL_DATABASE=user
    ports:
      - "3307:3306"
    volumes:
      - user-mysql-data:/var/lib/mysql
    networks:
      - backend

  product-service:
    build: ./product-service
    image: product-service:latest
    container_name: product-service
    ports:
      - "8086:8086"
    depends_on:
      - product-mysql
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://product-mysql:3306/product
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root@123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_USERNAME=default
      - SPRING_DATA_REDIS_PASSWORD=root@123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8082/eureka/
    networks:
      - backend

  product-mysql:
    image: mysql:8.0
    container_name: product-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root@123
      - MYSQL_DATABASE=product
    ports:
      - "3308:3306"
    volumes:
      - product-mysql-data:/var/lib/mysql
    networks:
      - backend

  order-service:
    build: ./order-service
    image: order-service:latest
    container_name: order-service
    ports:
      - "8087:8087"
    depends_on:
      - order-mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://order-mysql:3306/order
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root@123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8082/eureka/
    networks:
      - backend

  order-mysql:
    image: mysql:8.0
    container_name: order-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root@123
      - MYSQL_DATABASE=order
    ports:
      - "3309:3306"
    volumes:
      - order-mysql-data:/var/lib/mysql
    networks:
      - backend

  analytics-service:
    build: ./analytics-service
    image: analytics-service:latest
    container_name: analytics-service
    ports:
      - "8088:8088"
    depends_on:
      - analytics-mysql
      - kafka
      - discovery-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://analytics-mysql:3306/analytics
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root@123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8082/eureka/
    networks:
      - backend

  analytics-mysql:
    image: mysql:8.0
    container_name: analytics-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root@123
      - MYSQL_DATABASE=analytics
    ports:
      - "3310:3306"
    volumes:
      - analytics-mysql-data:/var/lib/mysql
    networks:
      - backend

  angular-ui:
    build: ./productify-app
    image: productify-app:latest
    container_name: productify-app
    ports:
      - "8090:8090"
    depends_on:
      - api-gateway-service
    networks:
      - backend

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/microservices:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - backend

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
      - loki
    networks:
      - backend

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - backend

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  user-mysql-data:
  product-mysql-data:
  order-mysql-data:
  cart-mongo-data:
  kafka-data:
  analytics-mysql-data:
