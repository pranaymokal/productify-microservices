<div class="auth-container">
  <p-card header="Welcome Back" subheader="Sign in to your Productify account">
    <div *ngIf="errorMessage" class="error-banner">
      <i class="pi pi-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          pInputText
          formControlName="username"
          placeholder="Enter your username"
          class="w-full"
        />
        <small
          *ngIf="signInForm.get('username')?.invalid && signInForm.get('username')?.touched"
          class="field-error"
        >
          Username is required (min 3 characters).
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          pInputText
          formControlName="password"
          placeholder="Enter your password"
          class="w-full"
        />
        <small
          *ngIf="signInForm.get('password')?.invalid && signInForm.get('password')?.touched"
          class="field-error"
        >
          Password is required (min 6 characters).
        </small>
      </div>

      <div class="action-buttons">
        <button
          pButton
          type="submit"
          label="Sign In"
          icon="pi pi-sign-in"
          [loading]="isLoading"
          [disabled]="signInForm.invalid || isLoading"
          class="w-full"
        ></button>
      </div>

      <div class="footer-links">
        <span>Don't have an account? </span>
        <a routerLink="/signup">Sign Up</a>
      </div>
    </form>
  </p-card>
</div>
