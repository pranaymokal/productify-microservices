server {
    listen 8090;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression (significantly reduces bundle download size)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Static Assets: Long cache duration (Angular hashes these filenames automatically)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # index.html: Must NOT be cached so clients pick up new deployments immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # SPA routing: Forward all unmatched routes back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}