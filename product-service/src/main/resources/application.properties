springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Resilience4j Circuit Breaker Configuration
# Type of sliding window used to record call outcomes: COUNT_BASED (last N calls) or TIME_BASED (calls in last N seconds)
resilience4j.circuitbreaker.instances.productService.sliding-window-type=COUNT_BASED

# Number of calls recorded in the sliding window to evaluate failure rate (when COUNT_BASED)
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10

# Minimum number of calls required before the circuit breaker can calculate error rate and decide to trip
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5

# Failure rate threshold in percentage (e.g., 50%). If failure rate >= 50%, the circuit breaker opens
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50

# Time duration that the circuit breaker stays in OPEN state before transitioning to HALF_OPEN
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=5s

# Number of test calls permitted when the circuit breaker is in HALF_OPEN state to check service recovery
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3

# Automatically transitions from OPEN to HALF_OPEN once wait duration expires, without waiting for the next request
resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true

# Expose Circuit Breaker status in Actuator Health
management.health.circuitbreakers.enabled=true

# ====================================================
# Resilience4j Retry Configuration
# ====================================================
# Maximum number of retry attempts (including initial call)
resilience4j.retry.instances.productService.max-attempts=3

# Initial wait duration between retry attempts
resilience4j.retry.instances.productService.wait-duration=1s

# Enable exponential backoff (1s, 2s)
resilience4j.retry.instances.productService.enable-exponential-backoff=true
resilience4j.retry.instances.productService.exponential-backoff-multiplier=2

# Do not retry 404 ResourceNotFoundException
resilience4j.retry.instances.productService.ignore-exceptions[0]=com.microservices.product.product_service.exception.ResourceNotFoundException

# Expose Retry status in Actuator Health
management.health.retries.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always


