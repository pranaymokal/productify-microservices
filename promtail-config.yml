server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Scrape all Docker containers running in the compose stack
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'app'

  # 2. Scrape local file logs mounted from ./logs directory (for services running locally or writing to disk)
  - job_name: local-service-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: microservices-file-logs
          __path__: /var/log/microservices/*.log
    relabel_configs:
      - source_labels: ['__path__']
        regex: '.*/([^/]+?)(?:\\.[0-9-]+)?\\.log$'
        target_label: 'app'
